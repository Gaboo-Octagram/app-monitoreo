<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sistema de Calidad</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
        </div>
        <div class="brand-text">
          <strong>Sistema de Calidad</strong>
          <span id="storeName">Auditorías e Inspecciones</span>
        </div>
      </div>
      <nav class="nav" aria-label="Principal">
        <a href="#/inicio" data-view="inicio">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
          <span>Inicio</span>
        </a>
        <a href="#/historial" data-view="historial">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
          <span>Historial</span>
        </a>
        <a href="#/resumen" data-view="resumen">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10"/><path d="M10 20V4"/><path d="M16 20v-7"/><path d="M22 20H2"/></svg>
          <span>Resumen</span>
        </a>
        <a href="#/config" data-view="config">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
          <span>Configuración</span>
        </a>
      </nav>
      <div class="sidebar-foot">Datos guardados en este navegador</div>
    </aside>

    <div class="main">
      <header class="topbar">
        <h1 id="pageTitle">Inicio</h1>
        <div class="topbar-right">
          <button type="button" class="chip user" id="accountChip" hidden>Iniciar sesión</button>
          <span class="chip" id="todayLabel"></span>
          <a class="chip user" href="#/config" id="evaluatorLabel" title="Cambiar en Configuración → General"></a>
        </div>
      </header>
      <main id="view" tabindex="-1"></main>
    </div>
  </div>

  <div id="modalRoot"></div>
  <div id="toasts" aria-live="polite"></div>
  <div id="printArea"></div>
  <input type="file" id="photoInput" accept="image/*" hidden>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    if (typeof window.supabase === 'undefined') {
      document.write('<script src="https://unpkg.com/@supabase/supabase-js@2"><\/script>');
    }
  </script>
  <script src="./supabaseClient.js"></script>
  <script src="./data/provider.js"></script>
  <script src="./data/local-storage-provider.js"></script>
  <script src="./data/supabase-read.js"></script>
  <script src="./app.js"></script>
  <script src="./auth.js"></script>
</body>
</html>
